[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "berkeley-dining-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "SQLAlchemy==2.0.52",
  "psycopg[binary]==3.3.5", "alembic==1.20.0", "httpx==0.28.1",
  "defusedxml==0.7.1", "APScheduler==3.11.3", "tzdata==2026.4",
  "PyJWT[crypto]==2.14.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
