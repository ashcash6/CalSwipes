services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: berkeley
      POSTGRES_USER: berkeley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berkeley -d berkeley"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    environment: &env
      DATABASE_URL: postgresql+psycopg://berkeley:${POSTGRES_PASSWORD}@db:5432/berkeley
      STALE_HOURS: ${STALE_HOURS:-36}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-BerkeleyPlate/0.1}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    build: .
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
volumes:
  pgdata:
