name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: berkeley_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d berkeley_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/berkeley_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/berkeley_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic check
