name: Scrape Berkeley Dining Menus

on:
  schedule:
    - cron: '15 */3 * * *'  # every 3 hours at :15 past
  workflow_dispatch:          # allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.lock

      - name: Export menu data
        run: python -m app.export --output menus

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menus/
          if git diff --cached --quiet; then
            echo "No menu changes to commit"
          else
            git commit -m "data: refresh menus $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
