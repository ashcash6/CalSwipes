name: iOS build and tests
on: [push, pull_request]
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export untrained CoreML integration fixture
        run: |
          python -m pip install -r Tools/requirements-models.txt
          python Tools/export_smoke_model.py
      - name: Verify bundled trained segmentation packages
        run: python Tools/verify_models.py
      - run: xcodegen generate
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          data = json.load(open('/tmp/simulators.json'))
          phones = [d for devices in data['devices'].values() for d in devices if d['name'].startswith('iPhone')]
          if not phones:
              raise RuntimeError('No iPhone simulator installed')
          print('SIMULATOR_ID=' + phones[0]['udid'])
          PY
      - run: xcodebuild test -project BerkeleyPlate.xcodeproj -scheme BerkeleyPlate -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - name: Build release without demo UI
        run: xcodebuild build -project BerkeleyPlate.xcodeproj -scheme BerkeleyPlate -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
