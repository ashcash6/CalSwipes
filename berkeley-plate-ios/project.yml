name: CalSwipes
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
  fileTypes:
    mlpackage:
      file: true
      buildPhase: sources
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  CalSwipes:
    type: application
    platform: iOS
    sources:
      - CalSwipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CalSwipes.entitlements
  CalSwipesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CalSwipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CalSwipes:
    build:
      targets:
        CalSwipes: all
    test:
      targets: [CalSwipesTests]
